<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四轴飞行器 - PCB 交互教程</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d1117; --bg2: #161b22; --bg3: #1c2129;
      --border: #30363d; --text: #c9d1d9; --text2: #8b949e; --text3: #484f58;
      --accent: #58a6ff; --card: #161b22; --input-bg: #21262d;
      --glow-bg: rgba(255,255,200,0.55);
    }
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .header {
      background: linear-gradient(135deg, #161b22 0%, var(--bg3) 100%);
      border-bottom: 1px solid var(--border); padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header h1 { font-size: 1.1rem; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .header h1 .icon { font-size: 1.3rem; }
    .header .badge {
      background: #1f6feb; color: #fff; font-size: 0.7rem;
      padding: 4px 10px; border-radius: 12px;
    }
    .header .nav-tabs { display: flex; gap: 4px; }
    .header .nav-tab {
      padding: 6px 16px; border-radius: 6px; font-size: 0.82rem;
      cursor: pointer; border: 1px solid transparent; color: var(--text2);
      background: transparent; transition: all 0.2s;
    }
    .header .nav-tab:hover { color: var(--text); border-color: var(--border); }
    .header .nav-tab.active { color: var(--accent); border-color: #1f6feb; background: rgba(31,111,235,0.1); }

    .main { display: flex; height: calc(100vh - 56px); }

    /* 左侧：元件列表 */
    .sidebar {
      width: 200px; background: var(--bg2); border-right: 1px solid var(--border);
      padding: 8px; overflow-y: auto; flex-shrink: 0;
    }
    .nav-title {
      padding: 8px 8px; font-size: 0.85rem; font-weight: 700; color: var(--text);
      cursor: pointer; user-select: none; border-radius: 6px;
    }
    .nav-title:hover { background: var(--bg3); }
    .nav-sub {
      padding: 6px 8px; font-size: 0.8rem; color: var(--text);
      cursor: pointer; user-select: none; border-radius: 6px;
    }
    .nav-sub:hover { background: var(--bg3); }
    .nav-children { padding-left: 6px; }
    .nav-children.hidden { display: none; }
    .arrow { font-size: 0.65rem; display: inline-block; width: 12px; }
    .comp-btn {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 5px 8px; margin-bottom: 2px; border-radius: 5px;
      border: 1px solid transparent; cursor: pointer;
      background: transparent; color: var(--text2); font-size: 0.73rem; text-align: left;
      transition: all 0.15s;
    }
    .comp-btn:hover { background: var(--bg3); color: var(--text); }
    .comp-btn.active { background: var(--bg3); border-color: var(--accent); color: var(--text); }
    .comp-btn .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    /* 中间：PCB 图 */
    .pcb-area {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 16px; background: var(--bg);
      min-width: 0;
    }
    .pcb-container {
      position: relative; display: inline-block; overflow: hidden;
      border-radius: 12px; cursor: grab;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.04) inset;
    }
    .pcb-container:active { cursor: grabbing; }
    .pcb-image-wrapper { position: relative; display: inline-block; line-height: 0; }
    .pcb-base { max-height: 88vh; max-width: 100%; border-radius: 12px; display: block; }
    .pcb-glow {
      position: absolute; border-radius: 4px;
      background: var(--glow-bg);
      mix-blend-mode: screen;
      opacity: 0; transition: opacity 0.15s;
      pointer-events: none;
    }
    .pcb-glow.visible { opacity: 1; }
    .pcb-inner {
      position: relative;
      transform-origin: 0 0;
      transition: none;
    }
    .zoom-controls {
      position: absolute; bottom: 12px; right: 12px; z-index: 5;
      display: flex; gap: 4px;
    }
    .zoom-controls button {
      width: 32px; height: 32px; border-radius: 8px;
      border: 1px solid var(--border); background: rgba(22,27,34,0.9); color: var(--text);
      font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px); transition: all 0.2s;
    }
    .zoom-controls button:hover { background: var(--bg3); border-color: var(--accent); color: var(--accent); }
    .zoom-controls .zoom-level { font-size: 0.7rem; color: var(--text2); display: flex; align-items: center; padding: 0 6px; min-width: 40px; justify-content: center; }

    .marker {
      position: absolute; border: 1px dashed rgba(255,255,255,0.25); border-radius: 4px;
      cursor: pointer; z-index: 3; background: transparent;
    }
    .marker.selected {
      border: 2px dashed rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.05);
    }
    .marker .label {
      position: absolute; top: -18px; left: 0;
      font-size: 9px; padding: 1px 5px; border-radius: 3px;
      color: #fff; white-space: nowrap; pointer-events: none;
      opacity: 0; transition: opacity 0.2s;
    }
    .marker:hover .label,
    .marker.selected .label { opacity: 0.85; }

    /* 右侧：信息面板 */
    .panel {
      width: 360px; background: var(--bg2); border-left: 1px solid var(--border);
      padding: 20px; overflow-y: auto; flex-shrink: 0;
    }
    .panel h3 { font-size: 1.05rem; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .panel .desc { font-size: 0.78rem; color: var(--text2); line-height: 1.5; }
    .panel .meta { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .panel .meta-item { font-size: 0.7rem; }
    .panel .section-divider { border: none; border-top: 1px solid var(--input-bg); margin: 10px 0; }
    .panel .meta-item .key { color: var(--text3); }
    .panel .meta-item .val { color: var(--text2); }

    /* Collapsible sections */
    .info-section { margin-top: 10px; border: 1px solid var(--input-bg); border-radius: 8px; overflow: hidden; }
    .info-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: var(--bg3); cursor: pointer;
      font-size: 0.78rem; color: var(--text); user-select: none;
      transition: background 0.15s;
    }
    .info-section-header:hover { background: var(--input-bg); }
    .info-section-header .arr { font-size: 0.6rem; transition: transform 0.2s; color: var(--text3); }
    .info-section.collapsed .arr { transform: rotate(-90deg); }
    .info-section.collapsed .info-section-body { display: none; }
    .info-section-body { padding: 10px 12px; }
    .info-section-body .sec-desc { font-size: 0.78rem; color: var(--text2); line-height: 1.6; }
    .info-section-body .sec-notes {
      font-size: 0.76rem; color: #b0b0c0; line-height: 1.7;
    }
    .info-section-body img {
      width: 100%; border-radius: 6px; border: 1px solid var(--border);
      cursor: zoom-in; transition: transform 0.2s;
    }
    .info-section-body img:hover { transform: scale(1.02); }
    .info-extras { margin-top: 10px; }

    .empty-state { text-align: center; padding: 40px 0; color: var(--text3); font-size: 0.85rem; line-height: 1.8; }

    /* 底部调整栏 */
    .adjust-bar {
      position: fixed; bottom: 0; left: 200px; right: 360px;
      background: var(--bg2); border-top: 1px solid var(--border);
      padding: 8px 16px; display: flex; align-items: center; gap: 12px;
      font-size: 0.75rem; z-index: 10;
    }
    .adjust-bar .label-text { color: var(--text2); white-space: nowrap; }
    .adjust-bar input[type=range] { flex: 1; accent-color: var(--accent); }
    .adjust-bar .val { color: var(--accent); font-weight: 700; min-width: 36px; }
    .adjust-bar button { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); cursor: pointer; }
    .adjust-bar button:hover { background: var(--border); }

    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Program view */
    #programView { width: 100%; height: 100%; overflow: hidden; align-self: stretch; margin-top: 0; }
    #progFlowView { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #progDetailView { width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; display: block; }
    .flow-diagram {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 20px;
    }
    .flow-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .flow-node {
      background: linear-gradient(135deg, #161b22, var(--bg3));
      border: 1px solid var(--border); border-radius: 10px;
      padding: 16px 20px; cursor: pointer; text-align: center;
      min-width: 105px; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    .flow-node:hover {
      border-color: var(--accent); background: linear-gradient(135deg, var(--bg3), #1f2d3d);
      transform: translateY(-3px); box-shadow: 0 8px 24px rgba(31,111,235,0.15);
    }
    .flow-node.active {
      border-color: var(--accent); background: linear-gradient(135deg, #1a2a3a, #1f3040);
      box-shadow: 0 4px 16px rgba(31,111,235,0.2);
    }
    .flow-node .fn-icon { font-size: 1.3rem; margin-bottom: 4px; }
    .flow-node .fn-title { font-size: 0.85rem; color: var(--text); font-weight: 600; margin-bottom: 2px; }
    .flow-node .fn-sub { font-size: 0.68rem; color: #6e7681; }
    .flow-node.key .fn-title { color: #ffa657; }
    .flow-arrow { color: var(--border); font-size: 1.3rem; display: flex; align-items: center; }
    .flow-arrow-down { color: var(--border); font-size: 1.1rem; text-align: center; margin: 2px 0; }
    .flow-label { font-size: 0.78rem; color: #6e7681; text-align: center; margin-bottom: 16px; letter-spacing: 2px; }
    .flow-arrow {
      color: var(--text3); font-size: 1.2rem; display: flex; align-items: center;
    }
    .flow-arrow-down { color: var(--text3); font-size: 1rem; text-align: center; }
    .flow-label {
      font-size: 0.7rem; color: var(--text3); text-align: center; margin: 4px 0;
    }
    .prog-btn {
      display: flex; align-items: center; gap: 6px; width: 100%;
      padding: 5px 8px; margin-bottom: 2px; border-radius: 5px;
      border: 1px solid transparent; cursor: pointer;
      background: transparent; color: var(--text2); font-size: 0.73rem; text-align: left;
      transition: all 0.15s;
    }
    .prog-btn:hover { background: var(--bg3); color: var(--text); }
    .prog-btn.active { background: var(--bg3); border-color: #ffa657; color: #ffa657; }
    .prog-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* Code block */
    .code-block {
      background: var(--bg); border: 1px solid var(--input-bg); border-radius: 6px;
      padding: 12px; font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.73rem; line-height: 1.5; color: var(--text);
      max-height: 300px; overflow-y: auto; white-space: pre-wrap;
    }
    .code-block .kw { color: #ff7b72; }
    .code-block .fn { color: #d2a8ff; }
    .code-block .cm { color: var(--text2); }
    .code-block .str { color: #a5d6ff; }

    /* Program detail page */
    #progDetailView {
      width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
    }
    .prog-detail {
      padding: 24px 32px; color: var(--text);
    }
    .prog-detail h2 { font-size: 1.4rem; color: var(--text); margin-bottom: 6px; }
    .prog-detail .subtitle { font-size: 0.8rem; color: var(--text3); margin-bottom: 24px; }
    .prog-detail .back-btn {
      background: var(--input-bg); border: 1px solid var(--border); color: var(--text2);
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.78rem;
      margin-bottom: 20px; transition: all 0.15s;
    }
    .prog-detail .back-btn:hover { border-color: var(--accent); color: var(--text); }
    .prog-detail h3 { font-size: 1rem; color: var(--text); margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--input-bg); }
    .prog-detail p { font-size: 0.82rem; line-height: 1.8; color: #b0b0c0; margin-bottom: 12px; }
    .prog-detail ul { font-size: 0.8rem; line-height: 1.9; padding-left: 18px; color: #b0b0c0; margin-bottom: 12px; }
    .prog-detail ul li { margin-bottom: 4px; }
    .prog-detail ul li b { color: var(--text); }
    .prog-detail .highlight-box {
      background: var(--bg3); border-left: 3px solid #ffa657;
      padding: 12px 16px; border-radius: 0 6px 6px 0; margin: 16px 0;
      font-size: 0.8rem; line-height: 1.7;
    }
    .prog-detail .data-diagram {
      background: var(--bg); border: 1px solid var(--input-bg); border-radius: 8px;
      padding: 16px; margin: 12px 0; font-family: 'Consolas', monospace;
      font-size: 0.75rem; line-height: 1.8; overflow-x: auto;
    }
    .prog-detail .data-table {
      width: 100%; border-collapse: collapse; font-size: 0.78rem; margin: 12px 0;
    }
    .prog-detail .data-table th {
      background: var(--input-bg); color: var(--text2); padding: 8px 12px; text-align: left;
      font-weight: 600; font-size: 0.72rem; text-transform: uppercase;
    }
    .prog-detail .data-table td {
      padding: 8px 12px; border-bottom: 1px solid var(--input-bg); color: var(--text);
    }
    .prog-detail .formula {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px 16px; margin: 10px 0; font-family: 'Consolas', monospace;
      font-size: 0.78rem; text-align: center; color: #d2a8ff;
    }

    /* 原理图全屏弹窗 */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
      display: flex; align-items: center; justify-content: center; cursor: zoom-out;
    }
    .modal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

    @media (max-width: 900px) {
      .main { flex-direction: column; height: auto; }
      .sidebar { width: 100%; flex-direction: row; display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; }
      .sidebar h3 { display: none; }
      .comp-btn { width: auto; font-size: 0.7rem; padding: 4px 8px; }
      .panel { width: 100%; }
      .adjust-bar { left: 0; right: 0; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1><span class="icon">🚁</span> 四轴飞行器教程</h1>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tabDrone" onclick="switchTab('drone')">🚁 飞行器</button>
    <button class="nav-tab" id="tabRemote" onclick="switchTab('remote')">🎮 遥控器</button>
  </div>
  <span class="badge">v2026.06.10</span>
</div>

<div class="main">

  <!-- 左侧导航 -->
  <div class="sidebar" id="sidebar">
    <div class="nav-title" onclick="openSerialTerminal()" style="color:#3fb950;">
      🔌 串口调试
    </div>
    <div class="nav-title" onclick="openPIDDebug()" style="color:#ffa657;">
      📊 PID调试
    </div>
    <div class="nav-title" onclick="toggleNav('drone')">
      <span class="arrow" id="arrowDrone">▶</span> 无人机
    </div>
    <div class="nav-children hidden" id="navDrone">
      <div class="nav-sub" onclick="toggleNav('hardware')">
        <span class="arrow" id="arrowHardware">▶</span> 硬件
      </div>
      <div class="nav-children hidden" id="navHardware"></div>
      <div class="nav-sub" onclick="toggleNav('program')">
        <span class="arrow" id="arrowProgram">▶</span> 程序
      </div>
      <div class="nav-children hidden" id="navProgram">
        <div id="navProgList"></div>
      </div>
      <div class="nav-sub" onclick="toggleNav('example')">
        <span class="arrow" id="arrowExample">▶</span> 例程
      </div>
      <div class="nav-children hidden" id="navExample"></div>
    </div>
    <div class="nav-title" onclick="toggleNav('remote')" style="margin-top:2px;">
      <span class="arrow" id="arrowRemote">▶</span> 遥控器
    </div>
    <div class="nav-children hidden" id="navRemote">
      <div class="nav-sub" onclick="toggleNav('remoteHw')">
        <span class="arrow" id="arrowRemoteHw">▶</span> 硬件
      </div>
      <div class="nav-children hidden" id="navRemoteHw"></div>
      <div class="nav-sub" onclick="toggleNav('remoteProg')">
        <span class="arrow" id="arrowRemoteProg">▶</span> 程序
      </div>
      <div class="nav-children hidden" id="navRemoteProg"></div>
      <div class="nav-sub" onclick="toggleNav('remoteExample')">
        <span class="arrow" id="arrowRemoteExample">▶</span> 例程
      </div>
      <div class="nav-children hidden" id="navRemoteExample"></div>
    </div>
  </div>

  <!-- 中间：PCB 图 / 程序流程 -->
  <div class="pcb-area" id="centerArea">
    <!-- PCB view -->
    <div id="hardwareView">
    <div class="pcb-container" id="pcbContainer">
      <div class="pcb-inner" id="pcbInner">
        <div class="pcb-image-wrapper">
          <img src="3D_PCB3_2026-06-09.png" alt="四轴飞行器 PCB 3D" class="pcb-base" draggable="false" />
          <div class="pcb-glow" id="pcbGlow"></div>
          <div class="pcb-glow" id="pcbGlow2"></div>
        </div>
        <!-- markers appended by JS -->
      </div>
      <div class="zoom-controls">
        <button onclick="zoomIn()" title="放大">+</button>
        <span class="zoom-level" id="zoomLevel">100%</span>
        <button onclick="zoomOut()" title="缩小">−</button>
        <button onclick="zoomReset()" title="重置">↺</button>
      </div>
    </div>
    </div><!-- /hardwareView -->

    <!-- Program view - flow diagram -->
    <div id="programView" class="hidden">
      <div id="progFlowView"><div class="flow-diagram" id="flowDiagram"></div></div>
      <div id="progDetailView" class="hidden"></div>
    </div>
    
    <!-- Serial terminal view -->
    <div id="serialView" class="hidden" style="width:100%;height:100%;display:flex;flex-direction:column;padding:16px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
        <button id="serialConnect" onclick="toggleSerial()" style="background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;">连接串口</button>
        <select id="serialPortSelect" style="background:var(--bg2);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:0.78rem;min-width:180px;" onchange="onPortSelect()">
          <option value="">选择端口（首次需点连接按钮）</option>
        </select>
        <button onclick="refreshSerialPorts()" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:0.72rem;" title="刷新端口列表">↻</button>
        <select id="serialBaud" style="background:var(--bg2);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:0.82rem;">
          <option value=9600>9600</option><option value=19200>19200</option><option value=38400>38400</option>
          <option value=57600>57600</option><option value=115200 selected>115200</option><option value=256000>256000</option>
        </select>
        <span id="serialStatus" style="font-size:0.78rem;color:var(--text2);">未连接</span>
        <span style="flex:1"></span>
        <button onclick="clearSerial()" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.78rem;">清空</button>
        <button id="serialPause" onclick="pauseSerial()" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.78rem;">暂停</button>
      </div>
      <div id="serialOutput" style="flex:1;background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:14px;font-family:'Consolas','Courier New',monospace;font-size:0.8rem;color:#3fb950;overflow-y:auto;white-space:pre-wrap;word-break:break-all;">
        <span style="color:var(--text3);">等待连接串口设备...</span>
      </div>
    </div>

    <!-- PID debug view -->
    <div id="pidView" class="hidden" style="width:100%;height:100%;display:flex;flex-direction:column;padding:16px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
        <button id="pidConnect" onclick="togglePIDSerial()" style="background:var(--accent);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;">连接串口</button>
        <select id="pidPortSelect" style="background:var(--bg2);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:0.78rem;min-width:180px;" onchange="onPIDPortSelect()">
          <option value="">选择端口（首次需点连接按钮）</option>
        </select>
        <button onclick="refreshPIDPorts()" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:0.72rem;">↻</button>

let activeCompId = null;
const pcbContainer = document.getElementById('pcbContainer');
const pcbInner = document.getElementById('pcbInner');
const panel = document.getElementById('panel');
const sidebar = document.getElementById('sidebar');

// === Zoom & Pan ===
let zoom = 1, panX = 0, panY = 0;
let dragging = false, dragStartX = 0, dragStartY = 0, startPanX = 0, startPanY = 0;

function applyTransform() {
  pcbInner.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  document.getElementById('zoomLevel').textContent = Math.round(zoom * 100) + '%';
}

pcbContainer.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = pcbContainer.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const oldZoom = zoom;
  zoom = Math.min(4, Math.max(0.3, zoom - e.deltaY * 0.001));
  panX = mx - (mx - panX) * (zoom / oldZoom);
  panY = my - (my - panY) * (zoom / oldZoom);
  applyTransform();
}, { passive: false });

pcbContainer.addEventListener('mousedown', (e) => {
  if (e.target.tagName === 'IMG' || e.target === pcbInner) {
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    startPanX = panX; startPanY = panY;
    e.preventDefault();
  }
});

window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  panX = startPanX + e.clientX - dragStartX;
  panY = startPanY + e.clientY - dragStartY;
  applyTransform();
});

window.addEventListener('mouseup', () => { dragging = false; });

// Click on PCB background to deselect
pcbInner.addEventListener('click', (e) => {
  if (e.target === pcbInner || e.target === pcbInner.querySelector('img') || e.target.id === 'pcbGlow') {
    activeCompId = null;
    document.querySelectorAll('.pcb-glow').forEach(g => {
      g.classList.remove('visible');
      g.style.transform = '';
    });
    panel.innerHTML = '<div class="empty-state">点击 PCB 图上的<br>元件区域查看详细资料</div>';
  }
});

window.zoomIn  = () => { zoom = Math.min(4, zoom * 1.25); applyTransform(); };
window.zoomOut = () => { zoom = Math.max(0.3, zoom / 1.25); applyTransform(); };
window.zoomReset = () => { zoom = 1; panX = 0; panY = 0; applyTransform(); };

// Highlight linked components
function highlightLinks(comp, show) {
  const allComps = [...components, ...remoteComponents];
  const linked = comp.linkId
    ? allComps.filter(c => c.linkId === comp.linkId)
    : [comp];
  const glowIds = ['pcbGlow', 'pcbGlow2'];
  linked.forEach((c, i) => {
    const glow = document.getElementById(glowIds[i] || 'pcbGlow');
    if (!glow) return;
    if (show) {
      glow.style.left = c.x + '%';
      glow.style.top = c.y + '%';
      glow.style.width = c.w + '%';
      glow.style.height = c.h + '%';
      glow.style.transform = c.rotate ? `rotate(${c.rotate}deg)` : '';
      glow.classList.add('visible');
    } else {
      glow.classList.remove('visible');
      glow.style.transform = '';
    }
  });
}

// Build markers and sidebar
components.forEach((comp, index) => {
  // Sidebar button
  const btn = document.createElement('button');
  btn.className = 'comp-btn';
  btn.innerHTML = `<span class="dot" style="background:${comp.color}"></span>${comp.name}`;
  btn.onclick = () => {
    document.getElementById('hardwareView').classList.remove('hidden');
    document.getElementById('programView').classList.add('hidden');
    selectComponent(comp.id);
  };
  document.getElementById('navHardware').appendChild(btn);
  comp._btn = btn;

  // Marker (invisible click/hover zone)
  const marker = document.createElement('div');
  marker.className = 'marker';
  const rot = comp.rotate ? `transform:rotate(${comp.rotate}deg);` : '';
  marker.style.cssText = `
    left:${comp.x}%; top:${comp.y}%;
    width:${comp.w}%; height:${comp.h}%;
    ${rot}
  `;
  marker.innerHTML = `<span class="label" style="background:${comp.color}">${comp.name}</span>`;
  marker.onclick = (e) => { e.stopPropagation(); selectComponent(comp.id); };

  // Hover: element highlight via glow layer
  marker.onmouseenter = () => {
    highlightLinks(comp, true);
    document.body.style.cursor = 'pointer';
  };
  marker.onmouseleave = () => {
    if (activeCompId !== comp.id) highlightLinks(comp, false);
    document.body.style.cursor = '';
  };

  pcbInner.appendChild(marker);
  comp._marker = marker;
});

function selectComponent(id) {
  const comp = components.find(c => c.id === id) || remoteComponents.find(c => c.id === id);
  if (!comp) return;

  activeCompId = id;

  // Clear all selected markers, set current
  [...components, ...remoteComponents].forEach(c => {
    if (c._marker) c._marker.classList.remove('selected');
  });
  if (comp._marker) comp._marker.classList.add('selected');

  // Show glow for selected component and linked
  highlightLinks(comp, true);

  // Update sidebar and markers
  [...components, ...remoteComponents].forEach(c => {
    if (c._btn) c._btn.classList.toggle('active', c.id === id);
    if (c._marker) c._marker.classList.remove('selected');
  });
  if (comp._marker) comp._marker.classList.add('selected');

  // Update panel
  let infoHTML = `
    <h3>${comp.name}</h3>
    <div class="meta">
      <div class="meta-item"><span class="key">位置：</span><span class="val">左${comp.x}% / 上${comp.y}% · ${comp.w}% × ${comp.h}%</span></div>
    </div>

    <div class="info-section">
      <div class="info-section-header" onclick="this.parentElement.classList.toggle('collapsed')">
        功能简介 <span class="arr">▼</span>
      </div>
      <div class="info-section-body">
        <div class="sec-desc">${comp.desc}</div>
      </div>
    </div>
  `;

  if (comp.notes) {
    infoHTML += `
    <div class="info-section">
      <div class="info-section-header" onclick="this.parentElement.classList.toggle('collapsed')">
        原理解析 <span class="arr">▼</span>
      </div>
      <div class="info-section-body">
        <div class="sec-notes">${comp.notes.replace(/\n/g, '<br>')}</div>
      </div>
    </div>
    `;
  }

  if (comp.schematic) {
    infoHTML += `
    <div class="info-section">
      <div class="info-section-header" onclick="this.parentElement.classList.toggle('collapsed')">
        关联原理图 <span class="arr">▼</span>
      </div>
      <div class="info-section-body">
        <img src="${comp.schematic}" alt="${comp.name} 原理图"
             onclick="openModal('${comp.schematic}')" title="点击放大" />
        <p style="font-size:0.65rem;color:var(--text3);margin-top:4px;">点击图片可放大查看</p>
      </div>
    </div>
    `;
  }

  if (comp.hasDatasheet) {
    infoHTML += `
    <div class="info-extras">
      <a href="${comp.datasheetFile}" target="_blank"
         style="color:var(--accent);font-size:0.78rem;text-decoration:none;">
        查看完整数据手册 (PDF) →
      </a>
    </div>
    `;
  }

  panel.innerHTML = infoHTML;

  // Update adjust bar
  document.getElementById('adjustName').textContent = comp.name;
  document.getElementById('adjLeft').value = comp.x;
  document.getElementById('adjTop').value = comp.y;
  document.getElementById('adjW').value = comp.w;
  document.getElementById('adjH').value = comp.h;
  document.getElementById('adjustBar').classList.remove('hidden');
}

function applyMarkerUpdate(comp) {
  const rot = comp.rotate ? `transform:rotate(${comp.rotate}deg);` : '';
  comp._marker.style.cssText = `
    left:${comp.x}%; top:${comp.y}%;
    width:${comp.w}%; height:${comp.h}%;
    ${rot}
  `;
  comp._marker.innerHTML = `<span class="label" style="background:${comp.color}">${comp.name}</span>`;

  comp._marker.onmouseenter = () => {
    highlightLinks(comp, true);
    document.body.style.cursor = 'pointer';
  };
  comp._marker.onmouseleave = () => {
    if (activeCompId !== comp.id) highlightLinks(comp, false);
    document.body.style.cursor = '';
  };

  // Refresh glow if selected
  if (activeCompId === comp.id) highlightLinks(comp, true);

  const metaDiv = panel.querySelector('.meta');
  if (metaDiv) {

}

#define Gyro_Read() IIC_read_Bytes(ADDR,0x3B,buffer,6)

    code: `// GetAngle() - Mahony互补滤波 四元数姿态解算
void GetAngle(const _st_Mpu *pMpu, _st_AngE *pAngE, float dt)
{
    static float KpDef = 0.8f;       // 比例增益
    static float KiDef = 0.0003f;    // 积分增益
    static Quaternion NumQ = {1,0,0,0};
    static struct V GyroIntegError = {0};

    float HalfTime = dt * 0.5f;

    // ① 四元数 → 理论重力方向
    Gravity.x = 2*(NumQ.q1*NumQ.q3 - NumQ.q0*NumQ.q2);
    Gravity.y = 2*(NumQ.q0*NumQ.q1 + NumQ.q2*NumQ.q3);
    Gravity.z = 1-2*(NumQ.q1*NumQ.q1 + NumQ.q2*NumQ.q2);

    // ② 加速度归一化
    NormQuat = Q_rsqrt(squa(accX)+squa(accY)+squa(accZ));
    Acc.x = pMpu->accX * NormQuat;
    Acc.y = pMpu->accY * NormQuat;
    Acc.z = pMpu->accZ * NormQuat;

    // ③ 叉积 = 姿态误差向量
    AccGravity.x = (Acc.y*Gravity.z - Acc.z*Gravity.y);
    AccGravity.y = (Acc.z*Gravity.x - Acc.x*Gravity.z);
    AccGravity.z = (Acc.x*Gravity.y - Acc.y*Gravity.x);

    // ④ 互补滤波：P(快速修正) + I(消除零偏漂移)
    GyroIntegError.x += AccGravity.x * KiDef;
    GyroIntegError.y += AccGravity.y * KiDef;
    GyroIntegError.z += AccGravity.z * KiDef;

    Gyro.x = pMpu->gyroX*Gyro_Gr + KpDef*AccGravity.x + GyroIntegError.x;
    Gyro.y = pMpu->gyroY*Gyro_Gr + KpDef*AccGravity.y + GyroIntegError.y;
    Gyro.z = pMpu->gyroZ*Gyro_Gr + KpDef*AccGravity.z + GyroIntegError.z;

    // ⑤ 一阶龙格库塔更新四元数
    q0_t = (-NumQ.q1*Gyro.x - NumQ.q2*Gyro.y - NumQ.q3*Gyro.z) * HalfTime;
    q1_t = ( NumQ.q0*Gyro.x - NumQ.q3*Gyro.y + NumQ.q2*Gyro.z) * HalfTime;
    q2_t = ( NumQ.q3*Gyro.x + NumQ.q0*Gyro.y - NumQ.q1*Gyro.z) * HalfTime;
    q3_t = (-NumQ.q2*Gyro.x + NumQ.q1*Gyro.y + NumQ.q0*Gyro.z) * HalfTime;

    NumQ.q0 += q0_t; NumQ.q1 += q1_t;
    NumQ.q2 += q2_t; NumQ.q3 += q3_t;

    // 四元数归一化（防止数值漂移）
    NormQuat = Q_rsqrt(squa(q0)+squa(q1)+squa(q2)+squa(q3));
    NumQ.q0 *= NormQuat; NumQ.q1 *= NormQuat;
    NumQ.q2 *= NormQuat; NumQ.q3 *= NormQuat;

    // ⑥ 四元数 → 欧拉角
    vecxZ = 2*NumQ.q0*NumQ.q2 - 2*NumQ.q1*NumQ.q3;
    vecyZ = 2*NumQ.q2*NumQ.q3 + 2*NumQ.q0*NumQ.q1;
    veczZ = 1 - 2*NumQ.q1*NumQ.q1 - 2*NumQ.q2*NumQ.q2;

    // 偏航：纯陀螺仪积分（无磁力计），±3°/s 静区防漂移
    float yaw_G = pMpu->gyroZ * Gyro_G;

        pAngE->yaw += yaw_G * dt;

    pAngE->pitch = asin(vecxZ) * RtA;           // 俯仰角
    pAngE->roll  = atan2f(vecyZ, veczZ) * RtA;  // 横滚角
}`,

function selectProgramModule(id) {
  const m = programModules.find(x => x.id === id);
  if (!m) return;
  activeProgId = id;

  // Update sidebar
  programModules.forEach(x => x._pbtn.classList.toggle('active', x.id === id));

  // Update flow nodes
  programModules.forEach(x => {
    const el = document.getElementById('fn_' + x.id);
    if (el) el.classList.toggle('active', x.id === id);
  });

  // 程序框架 → 返回流程图
  if (id === 'prog_init') {
    showProgramFlow();
    panel.innerHTML = buildPanelContent(m);
    return;
  }

  // Show detail page for modules that have one
  if (programDetailPages[id]) {
    showProgramDetail(id);
    return;
  }

  // Fallback: show in right panel
  panel.innerHTML = buildPanelContent(m);
}

function showProgramDetail(id) {
  document.getElementById('progFlowView').classList.add('hidden');
  const detail = document.getElementById('progDetailView');
  detail.classList.remove('hidden');

  detail.classList.add('fade-in');
  panel.innerHTML = '<div class="empty-state">← 左侧为详细说明<br>点击底部按钮返回流程图</div>';

      '<h3>二、核心算法：Mahony 互补滤波器</h3>' +

  { id: 'rme_key', name: '按键', desc: 'GPIO 按键扫描与去抖', code: `// 按键扫描示例
void key_scan(void) {
    static uint8_t status = 0;
    switch(status) {
    case 0:  // 等待按下
        if(!(GPIOA->IDR & GPIO_Pin_6)) status = 1;
        break;
    case 1:  // 等待释放（去抖）

void write_AT24C02(uint8_t addr, int16_t data) {
    IIC_Start();
    IIC_Send_Byte(0xA0);        // 设备地址（写）
    IIC_Send_Byte(addr);        // 存储地址
    IIC_Send_Byte(data >> 8);   // 高字节
    IIC_Send_Byte(data & 0xFF); // 低字节
    IIC_Stop();
    delay_ms(5);  // 等待写入完成
}

int16_t read_AT24C02(uint8_t addr) {
    int16_t val;
    IIC_Start();
    IIC_Send_Byte(0xA0);  // 设备地址（写）
    IIC_Send_Byte(addr);  // 存储地址
    IIC_Start();
    IIC_Send_Byte(0xA1);  // 设备地址（读）

// Extract flow diagram builder as reusable function
function buildFlowDiagram(modules) {
  const isRemote = modules === remoteProgModules;
  const flowDiag = document.getElementById('flowDiagram');
  let html = `<div class="flow-label">◉ ${isRemote ? '遥控器' : '无人机'}程序流程图 ◉</div><div class="flow-row">`;
  const row1 = modules.filter(m => m.order <= 3);
  row1.forEach((m, i) => {
    const func = isRemote ? 'selectRemoteProgModule' : 'selectProgramModule';
    html += `<div class="flow-node${m.isKey?' key':''}" id="fn_${m.id}" onclick="${func}('${m.id}')"><div class="fn-title">${m.name}</div><div class="fn-sub">${m.desc.slice(0,20)}...</div></div>`;
    if (i < row1.length-1) html += '<div class="flow-arrow">→</div>';
  });
  html += '</div><div class="flow-arrow-down">↓</div><div class="flow-row">';
  const row2 = modules.filter(m => m.order >= 4);
  row2.forEach((m, i) => {
    const func = isRemote ? 'selectRemoteProgModule' : 'selectProgramModule';
    html += `<div class="flow-node${m.isKey?' key':''}" id="fn_${m.id}" onclick="${func}('${m.id}')"><div class="fn-title">${m.name}</div><div class="fn-sub">${m.desc.slice(0,20)}...</div></div>`;
    if (i < row2.length-1) html += '<div class="flow-arrow">→</div>';
  });
  html += '</div>';
  flowDiag.innerHTML = html;
}

function switchProduct(type) {

  document.querySelectorAll('.marker').forEach(m => m.remove());
  const allComps = [...components, ...remoteComponents];

window.toggleSerial = async function() {
  if (serialPort) {
    if (serialReader) { serialReader.cancel(); serialReader = null; }
    await serialPort.close();
    serialPort = null;
    document.getElementById('serialConnect').textContent = '连接串口';
    document.getElementById('serialStatus').textContent = '已断开';
    document.getElementById('serialStatus').style.color = 'var(--text2)';
    return;
  }
  if (!('serial' in navigator)) {
    const s = document.getElementById('serialStatus');
    s.textContent = '当前浏览器不支持串口，请用电脑版 Chrome 或 Edge 打开本页';
    s.style.color = '#f85149';
    return;
  }
  try {
    const port = await navigator.serial.requestPort();
    const baud = parseInt(document.getElementById('serialBaud').value);
    await port.open({ baudRate: baud });
    serialPort = port;
    document.getElementById('serialConnect').textContent = '断开';
    document.getElementById('serialStatus').textContent = '已连接 ' + baud + 'bps';
    document.getElementById('serialStatus').style.color = '#3fb950';
    serialPaused = false;
    document.getElementById('serialPause').textContent = '暂停';
    readSerialLoop();
  } catch (e) {
    if (e.name !== 'AbortError') {
      document.getElementById('serialStatus').textContent = '错误: ' + e.message;
      document.getElementById('serialStatus').style.color = '#f85149';
    }
  }
};

async function readSerialLoop() {
  const output = document.getElementById('serialOutput');
  if (!serialPort || !serialPort.readable) return;
  if (!serialBuffer) output.innerHTML = '';
  const decoder = new TextDecoder();
  try {
    while (serialPort.readable) {
      serialReader = serialPort.readable.getReader();
      try {
        while (true) {
          const { value, done } = await serialReader.read();
          if (done) break;
          if (serialPaused) continue;
          serialBuffer += decoder.decode(value, { stream: true });
          if (serialBuffer.length > 50000) serialBuffer = serialBuffer.slice(-40000);
          output.textContent = serialBuffer;
          output.scrollTop = output.scrollHeight;
        }
      } finally { serialReader.releaseLock(); }
    }
  } catch (e) {
    if (e.name !== 'AbortError' && e.name !== 'NetworkError') console.error(e);
  }
}

window.clearSerial = function() {
  serialBuffer = '';
  document.getElementById('serialOutput').innerHTML = '<span style=\"color:var(--text3);\">等待数据...</span>';
};

window.pauseSerial = function() {
  serialPaused = !serialPaused;
  document.getElementById('serialPause').textContent = serialPaused ? '继续' : '暂停';
};

      document.getElementById('pidStatus').textContent = '错误: ' + e.message;
      document.getElementById('pidStatus').style.color = '#f85149';
    }

async function readPIDLoop() {
  const decoder = new TextDecoder();
  let leftover = '';
  try {
    while (pidPort && pidPort.readable) {
      pidReader = pidPort.readable.getReader();
      try {
        while (true) {
          const { value, done } = await pidReader.read();
          if (done) break;
          if (pidPaused) continue;
          const text = decoder.decode(value, { stream: true });
          leftover += text;
          const lines = leftover.split(/\r?\n/);
          leftover = lines.pop() || '';
          for (const line of lines) {
            const parts = line.trim().split(/[,\\t ]+/);
            if (parts.length >= 2) {
              const desired = parseFloat(parts[0]);
              const actual = parseFloat(parts[1]);
              if (!isNaN(desired) && !isNaN(actual)) {
                pidHistory.push({ d: desired, a: actual });
                if (pidHistory.length > PID_MAX_POINTS) pidHistory.shift();
              }
            }
          }
          drawPIDCanvas();
        }
      } finally { pidReader.releaseLock(); }
    }
  } catch(e) {
    if (e.name !== 'AbortError' && e.name !== 'NetworkError') console.error(e);
  }
}

let pidCtx = null, pidW = 0, pidH = 0;
let pidZoomX = 1, pidZoomY = 1, pidPanX = 0, pidPanY = 0;
let pidDragging = false, pidDragStart = {x:0,y:0}, pidPanStart = {x:0,y:0};

function initPIDCanvas() {
  const canvas = document.getElementById('pidCanvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * (window.devicePixelRatio || 1);
  canvas.height = rect.height * (window.devicePixelRatio || 1);
  pidW = canvas.width; pidH = canvas.height;
  pidCtx = canvas.getContext('2d');
  pidZoomX = 1; pidZoomY = 1; pidPanX = 0; pidPanY = 0;
  pidHistory = [];
  document.getElementById('pidPlaceholder').style.display = 'block';
}

// Wheel zoom on PID canvas
(function() {
  const el = document.getElementById('pidCanvas').parentElement;
  el.addEventListener('wheel', (e) => {
    if (!pidCtx || pidHistory.length === 0) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.2 : 0.8;
    pidZoomX = Math.min(10, Math.max(0.2, pidZoomX * factor));
    pidZoomY = Math.min(10, Math.max(0.2, pidZoomY * factor));
    drawPIDCanvas();
  }, { passive: false });

  el.addEventListener('mousedown', (e) => {
    pidDragging = true;
    pidDragStart = { x: e.clientX, y: e.clientY };
    pidPanStart = { x: pidPanX, y: pidPanY };
  });
  window.addEventListener('mousemove', (e) => {
    if (!pidDragging) return;
    pidPanX = pidPanStart.x + (e.clientX - pidDragStart.x);
    pidPanY = pidPanStart.y - (e.clientY - pidDragStart.y);
    drawPIDCanvas();
  });
  window.addEventListener('mouseup', () => { pidDragging = false; });
})();

function roundToNice(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.abs(v)||1))); return Math.round(v/p)*p; }

function drawPIDCanvas() {
  if (!pidCtx || pidHistory.length === 0) return;
  document.getElementById('pidPlaceholder').style.display = 'none';
  const ctx = pidCtx, w = pidW, h = pidH;
  const margin = { top: 20, right: 20, bottom: 30, left: 55 };
  const pw = w - margin.left - margin.right;
  const ph = h - margin.top - margin.bottom;

  ctx.clearRect(0, 0, w, h);

  // Visible data
  const totalPts = pidHistory.length;
  const visPts = Math.max(10, Math.floor(totalPts / pidZoomX));
  const startIdx = Math.max(0, totalPts - visPts - Math.floor(pidPanX / 10));
  const visibleData = pidHistory.slice(startIdx);
  const count = visibleData.length;
  if (count < 2) return;

  // Y range
  let yMin = Infinity, yMax = -Infinity;
  for (const p of visibleData) { yMin = Math.min(yMin, p.d, p.a); yMax = Math.max(yMax, p.d, p.a); }
  const yRange = Math.max(yMax - yMin, 0.1);
  const yCenter = (yMin + yMax) / 2;
  const halfRange = yRange / (2 * pidZoomY);
  const yLo = yCenter - halfRange + pidPanY;
  const yHi = yCenter + halfRange + pidPanY;

  const toX = (i) => margin.left + pw * i / (count - 1);
  const toY = (v) => margin.top + ph * (1 - (v - yLo) / Math.max(yHi - yLo, 0.001));

  // Y axis grid + labels
  const yTickCount = 5;
  for (let i = 0; i <= yTickCount; i++) {
    const val = yLo + (yHi - yLo) * i / yTickCount;
    const y = toY(val);
    ctx.strokeStyle = i === 0 ? '#30363d' : '#1a1e2a'; ctx.lineWidth = i === 0 ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(w - margin.right, y); ctx.stroke();
    ctx.fillStyle = '#6e7681'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(0), margin.left - 6, y + 4);
  }

  // X axis
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(margin.left, toY(yLo)); ctx.lineTo(w - margin.right, toY(yLo)); ctx.stroke();

  // Axes frame
  ctx.strokeStyle = '#484f58'; ctx.lineWidth = 2;
  ctx.strokeRect(margin.left, margin.top, pw, ph);

  // Zero line (if visible)
  if (yLo <= 0 && yHi >= 0) {
    const zeroY = toY(0);
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(margin.left, zeroY); ctx.lineTo(w - margin.right, zeroY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Desired line (blue)
  ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(toX(0), toY(visibleData[0].d));
  for (let i = 1; i < count; i++) ctx.lineTo(toX(i), toY(visibleData[i].d));
  ctx.stroke();

  // Actual line (orange)
  ctx.strokeStyle = '#f0883e'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(toX(0), toY(visibleData[0].a));
  for (let i = 1; i < count; i++) ctx.lineTo(toX(i), toY(visibleData[i].a));
  ctx.stroke();

  // Axis labels
  ctx.fillStyle = '#8b949e'; ctx.font = '11px sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('时间 →', margin.left + pw/2, h - 4);
  ctx.save(); ctx.translate(10, margin.top + ph/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('数值', 0, 0); ctx.restore();

  // Zoom indicator
  ctx.fillStyle = '#484f58'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
  ctx.fillText('×' + pidZoomX.toFixed(1) + ' 滚轮缩放 | 拖拽平移', w - margin.right, margin.top - 6);
}

window.addEventListener('resize', () => { if (pidCtx) initPIDCanvas(); });

window.clearPID = function() { pidHistory = []; pidZoomX = 1; pidZoomY = 1; pidPanX = 0; pidPanY = 0; initPIDCanvas(); drawPIDCanvas(); };
window.pausePID = function() {
  pidPaused = !pidPaused;
  document.getElementById('pidPause').textContent = pidPaused ? '继续' : '暂停';
};

// Keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ============ 浏览器兼容性检测（Web Serial）============
// 只有 Chrome / Edge / Opera 等 Chromium 内核浏览器支持 Web Serial。
// 不支持的浏览器上，按钮置灰并在面板顶部给出中文提示，避免用户点到英文报错。
(function () {
  if ('serial' in navigator) return;
  var tip = '当前浏览器不支持串口调试，请用电脑版 Chrome 或 Edge 打开本页';
  ['serialConnect', 'pidConnect'].forEach(function (id) {
    var b = document.getElementById(id);
    if (!b) return;
    b.disabled = true;
    b.style.opacity = '0.45';
    b.style.cursor = 'not-allowed';
    b.title = tip;
    var view = b.closest('div[id$="View"]') || b.parentNode;
    if (view && !view.querySelector('.serial-unsupported')) {
      var bar = document.createElement('div');
      bar.className = 'serial-unsupported';
      bar.textContent = '⚠ ' + tip;
      bar.style.cssText = 'margin-bottom:10px;padding:8px 12px;border-radius:6px;'
        + 'background:rgba(248,81,73,.12);border:1px solid #f85149;'
        + 'color:#f85149;font-size:.78rem;line-height:1.5;';
      view.insertBefore(bar, view.firstChild);
    }
  });
})();
</script>
